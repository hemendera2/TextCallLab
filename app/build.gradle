plugins {
    id 'com.android.application'
}

android {
    namespace 'in.textcall.lab'
    compileSdk 35
    ndkVersion '27.2.12479018'

    defaultConfig {
        applicationId 'in.textcall.lab'
        minSdk 29
        targetSdk 35
        versionCode 13
        versionName '1.0-unified-hindi-neural'
        externalNativeBuild {
            cmake {
                cppFlags '-O3 -std=c++17'
                abiFilters 'arm64-v8a'
            }
        }
    }

    externalNativeBuild {
        cmake {
            path file('src/main/cpp/CMakeLists.txt')
            version '3.22.1'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

// Embedded Supertonic 3 runtime; no system TTS app needed.
dependencies {
    implementation 'com.github.k2-fsa:sherpa-onnx:v1.13.3'
}
