plugins {
    id 'com.android.application'
}

android {
    namespace 'in.textcall.lab'
    compileSdk 35
    ndkVersion '27.2.12479018'

    defaultConfig {
        applicationId 'in.textcall.lab'
        minSdk 29
        targetSdk 35
        versionCode 14
        versionName '1.0.1-navigation-model-restore'
        externalNativeBuild {
            cmake {
                cppFlags '-O3 -std=c++17'
                abiFilters 'arm64-v8a'
            }
        }
    }

    // One immutable private signing identity is required for data-preserving APK upgrades.
    // Secrets are injected only by CI; never place the keystore/password in source control.
    if (System.getenv('KALLVO_ANDROID_KEYSTORE_FILE')) {
        signingConfigs {
            kallvoStable {
                storeFile file(System.getenv('KALLVO_ANDROID_KEYSTORE_FILE'))
                storePassword System.getenv('KALLVO_ANDROID_STORE_PASSWORD')
                keyAlias System.getenv('KALLVO_ANDROID_KEY_ALIAS')
                keyPassword System.getenv('KALLVO_ANDROID_KEY_PASSWORD')
            }
        }
        buildTypes {
            debug { signingConfig signingConfigs.kallvoStable }
        }
    }

    externalNativeBuild {
        cmake {
            path file('src/main/cpp/CMakeLists.txt')
            version '3.22.1'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

// Embedded Supertonic 3 runtime; no system TTS app needed.
dependencies {
    implementation files('libs/sherpa-onnx-1.13.3.aar')
    implementation 'org.jetbrains.kotlin:kotlin-stdlib:2.0.21'
}
