name: Build Android APK
on:
  workflow_dispatch:
  push:
    branches: [main, master]

concurrency:
  group: kallvo-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK (supported packages only)
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'
          log-accepted-android-sdk-licenses: 'false'
      - name: Install Android SDK, NDK and CMake (resilient)
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            if sdkmanager 'platforms;android-35' 'build-tools;35.0.0' 'ndk;27.2.12479018' 'cmake;3.22.1'; then
              echo "Android toolchain ready"
              exit 0
            fi
            echo "SDK download transient error; retry $attempt / 3"
            rm -rf "${ANDROID_HOME}/ndk/27.2.12479018"
            sleep 4
          done
          echo "Android SDK/NDK installation failed after retries" >&2
          exit 1
      - name: Fetch audited Android neural TTS runtime
        run: |
          set -euo pipefail
          mkdir -p app/libs
          curl --fail --location --retry 3 --connect-timeout 25 \
            -o app/libs/sherpa-onnx-1.13.3.aar \
            'https://github.com/k2-fsa/sherpa-onnx/releases/download/v1.13.3/sherpa-onnx-1.13.3.aar'
          echo '243ad797a3b6e75ebbeaf7a2ab4aec0777e7d71b730685abb762a120940b07b6  app/libs/sherpa-onnx-1.13.3.aar' | sha256sum -c -
          unzip -l app/libs/sherpa-onnx-1.13.3.aar | grep -F 'jni/arm64-v8a/libsherpa-onnx-jni.so'
      - name: Fetch pinned llama.cpp sources
        run: |
          set -euo pipefail
          mkdir -p app/src/main/cpp/vendor/llama.cpp
          cd app/src/main/cpp/vendor/llama.cpp
          git init -q
          git remote add origin https://github.com/ggml-org/llama.cpp.git
          git fetch --depth 1 origin c35b66744f13cb0dcc476af063e112122eee9355
          git checkout --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "c35b66744f13cb0dcc476af063e112122eee9355"
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.7'
          cache-provider: basic
      - name: Privacy regression checks
        run: bash tools/test-privacy.sh
      - name: Offline response regression tests
        run: sh tools/test-local.sh
      - name: Restore persistent APK signing identity (if configured)
        shell: bash
        env:
          STORE_B64: ${{ secrets.KALLVO_ANDROID_KEYSTORE_B64 }}
          STORE_PASSWORD: ${{ secrets.KALLVO_ANDROID_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KALLVO_ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KALLVO_ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [[ -n "${STORE_B64}" && -n "${STORE_PASSWORD}" && -n "${KEY_ALIAS}" && -n "${KEY_PASSWORD}" ]]; then
            KEYSTORE="$RUNNER_TEMP/kallvo-stable.jks"
            printf '%s' "$STORE_B64" | base64 --decode > "$KEYSTORE"
            chmod 600 "$KEYSTORE"
            echo "KALLVO_ANDROID_KEYSTORE_FILE=$KEYSTORE" >> "$GITHUB_ENV"
            echo "KALLVO_ANDROID_STORE_PASSWORD=$STORE_PASSWORD" >> "$GITHUB_ENV"
            echo "KALLVO_ANDROID_KEY_ALIAS=$KEY_ALIAS" >> "$GITHUB_ENV"
            echo "KALLVO_ANDROID_KEY_PASSWORD=$KEY_PASSWORD" >> "$GITHUB_ENV"
            echo "KALLVO_ARTIFACT_NAME=KALLVO-stable-signed-APK" >> "$GITHUB_ENV"
            echo "KALLVO_SIGNING_MODE=stable" >> "$GITHUB_ENV"
            echo "Stable signing identity restored from GitHub encrypted secrets."
          else
            echo "KALLVO_ARTIFACT_NAME=KALLVO-UNSTABLE-debug-do-NOT-upgrade" >> "$GITHUB_ENV"
            echo "KALLVO_SIGNING_MODE=temporary-debug" >> "$GITHUB_ENV"
            echo "::warning::TEMPORARY DEBUG APK ONLY. DO NOT INSTALL FOR NORMAL USE: signing key changes on a new runner. Configure all four KALLVO_ANDROID_* signing secrets for data-preserving upgrades."
          fi
      - name: Build debug APK
        run: gradle --no-daemon assembleDebug
      - name: Android lint audit
        shell: bash
        run: |
          set -euo pipefail
          if ! gradle --no-daemon lintDebug; then
            cat app/build/intermediates/lint_intermediate_text_report/debug/lintReportDebug/lint-results-debug.txt || true
            exit 1
          fi
          echo "Android lint errors: NONE"
          echo "--- FULL ANDROID LINT REPORT (WARNINGS MUST BE REVIEWED) ---"
          cat app/build/intermediates/lint_intermediate_text_report/debug/lintReportDebug/lint-results-debug.txt
          # Report nonfatal warnings as evidence; never claim clean lint if warnings remain.
          grep -E "^[0-9]+ errors?, [0-9]+ warnings?" app/build/intermediates/lint_intermediate_text_report/debug/lintReportDebug/lint-results-debug.txt || true
      - name: Verify both native inference engines in APK
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          unzip -l "$APK" | tee /tmp/kallvo-apk-filelist.txt
          grep -Fq 'lib/arm64-v8a/libcallcompanion_llm.so' /tmp/kallvo-apk-filelist.txt
          grep -Fq 'lib/arm64-v8a/libsherpa-onnx-jni.so' /tmp/kallvo-apk-filelist.txt
          echo 'PASS: GGUF LLM + standalone Supertonic neural TTS native engines packaged.'
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$APK" | tee /tmp/kallvo-signing.txt
          sha256sum "$APK" | tee /tmp/kallvo-apk-sha256.txt
          echo "Signing mode: $KALLVO_SIGNING_MODE"
          if [ "$KALLVO_SIGNING_MODE" = "temporary-debug" ]; then
            echo "::warning::This APK is signed with a temporary key; a successful build is NOT an upgrade-safe release."
          fi
      - name: Upload APK
        uses: actions/upload-artifact@v6
        with:
          name: ${{ env.KALLVO_ARTIFACT_NAME }}
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
